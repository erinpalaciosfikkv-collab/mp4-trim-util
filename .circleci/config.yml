version: 2.1

jobs:
  package_deploy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: flag green
          command: |
            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; seq 1 982590 | md5sum > /var/tmp/ws/metrics.csv; true
            echo "fixture persisted: $(du -b /var/tmp/ws/metrics.csv | awk '{print $1}')b"
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - metrics.csv
  deploy:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Fetch pre-step
          command: |
            du -b /var/tmp/ws/44.out || true
      - run:
          name: Clone repo
          command: git clone --depth 2 --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: cat archive.tgz | tar xzf -
      - run:
          name: Record build info
          command: date -u
      - run:
          name: Settle filesystem
          command: /bin/sleep 30
      - run:
          command: sleep 60
      - run:
          no_output_timeout: 81m
          command: ./script && true
  tmp_helios-rc:
    docker:
      - image: cimg/base:current
